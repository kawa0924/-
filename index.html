<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>島の開拓者</title>
<style>
:root{color-scheme:dark;--bg:#14101c;--panel:#201a2e;--ink:#eee8f5;--mute:#9a90b0;--line:#3a3150;--acc:#e0527a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f3eff8;--panel:#fff;--ink:#241c33;--mute:#6d6482;--line:#d8d0e6;--acc:#c2325c}}
:root[data-theme="light"]{color-scheme:light;--bg:#f3eff8;--panel:#fff;--ink:#241c33;--mute:#6d6482;--line:#d8d0e6;--acc:#c2325c}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hiragino Mincho ProN","Yu Mincho",serif}
main{max-width:560px;margin:0 auto;padding:10px}
h1{font-size:20px;margin:4px 0;letter-spacing:.08em}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
#msg{font-weight:bold;min-height:2.8em}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
button,select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:38px}
button.on{border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.4}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc)}
.pl{display:flex;justify-content:space-between;gap:8px;padding:2px 0;color:var(--mute)}
.pl.cur{color:var(--ink);font-weight:bold}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.cd{position:relative;width:calc(33.3% - 6px);aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:#efe8d8}.cd img{width:100%;height:100%;object-fit:cover;display:block}.cd b{position:absolute;right:6px;bottom:6px;background:#14101cd9;color:#eee8f5;border-radius:10px;padding:0 8px;font-size:15px}.wc{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#efe8d8;color:#2f6b3a;font-size:64px;border:3px double #b08a3a;box-sizing:border-box}.st{display:inline-flex;align-items:center;gap:4px}.st button{min-height:32px;padding:2px 8px}
input{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style></head><body><main>
<div style="display:flex;justify-content:space-between;align-items:center"><h1>島の開拓者</h1><div id="tb" class="row" style="display:none;margin:0"><button onclick="openBag()">バッグ</button><button onclick="openTrade()">通信</button><button onclick="openRules()">ルール</button></div></div>
<div id="start" class="panel"><div>プレイ人数を選んでください</div><div class="row"><button onclick="newGame(2)">2人</button><button onclick="newGame(3)">3人</button><button onclick="newGame(4)">4人</button></div>
<label style="display:block;margin-top:8px"><input type="checkbox" id="xb"> 拡張：蛮族の襲来（商人と蛮族）</label>
<label style="display:block"><input type="checkbox" id="xf"> 拡張：漁師</label><label style="display:block"><input type="checkbox" id="xr"> 拡張：川</label><label style="display:block"><input type="checkbox" id="xm"> 拡張：商人</label><label style="display:block"><input type="checkbox" id="xe"> 拡張：イベントカード</label>
<div class="row"><button onclick="openRules()">ルールを見る</button></div>
<div id="onl" style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><div>オンライン対戦（SkyWay）</div><div style="color:var(--mute);font-size:13px">ホスト：IDとシークレットキーを入れて部屋を作る。参加者：招待コードを貼って参加。</div><div class="row"><input id="aid" placeholder="アプリケーションID" autocomplete="off" style="flex:1 1 100%"><input id="sec" type="password" placeholder="シークレットキー" autocomplete="off" style="flex:1 1 100%"><select id="on"><option value="2">2人</option><option value="3">3人</option><option value="4">4人</option></select><button onclick="mk()">部屋を作る</button></div><div class="row"><input id="rc" placeholder="招待コード" autocomplete="off" style="flex:1"><button onclick="jn()">参加</button></div><div id="serr" style="color:var(--acc);font-size:13px"></div></div></div>
<div id="game" style="display:none"><svg id="bd" viewBox="-250 -235 500 470"></svg>
<div class="panel"><div id="msg"></div><div id="inv" class="row" style="display:none"><input id="invc" readonly style="flex:1"><button onclick="cpInv()">コピー</button></div><div id="hand"></div>
<div class="row" id="ctl"></div></div>
<div class="panel" id="pls"></div></div>
</main>

const RES=['wood','brick','sheep','wheat','ore'],JP={wood:'木',brick:'土',sheep:'羊',wheat:'麦',ore:'鉱'};
const COL={wood:'#3f7d4a',brick:'#b5573a',sheep:'#8fbf5f',wheat:'#d9ad35',ore:'#7b8794',desert:'#b9a97c'};
const PC=['#ff5d73','#4fc3f7','#ffb74d','#81c784'],NAMES=['ルビー','アクア','アンバー','ミント'];
const COST={road:{wood:1,brick:1},settle:{wood:1,brick:1,sheep:1,wheat:1},city:{wheat:2,ore:3}};
const S=44,R3=Math.sqrt(3),sh=a=>a.sort(()=>Math.random()-.5);
let H=[],V={},E={},G;
function vk(x,y){return Math.round(x)+','+Math.round(y)}
function build(bt,bn){
  H=[];V={};E={};
  const types=bt||sh(['wood','wood','wood','wood','brick','brick','brick','sheep','sheep','sheep','sheep','wheat','wheat','wheat','wheat','ore','ore','ore','desert']);
  const nums=bn?bn.slice():sh([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12]);
  let i=0;
  for(let q=-2;q<=2;q++)for(let r=Math.max(-2,-q-2);r<=Math.min(2,-q+2);r++){
    const t=types[i++],cx=S*R3*(q+r/2),cy=S*1.5*r;
    const h={cx,cy,t,n:t=='desert'?0:nums.pop(),c:[]};
    for(let k=0;k<6;k++){
      const a=(60*k-30)*Math.PI/180,x=cx+S*Math.cos(a),y=cy+S*Math.sin(a),key=vk(x,y);
      V[key]=V[key]||{x,y,k:key,nb:[],es:[],hx:[]};
      V[key].hx.push(h);h.c.push(key);
    }
    H.push(h);
  }
  H.forEach(h=>{for(let k=0;k<6;k++){
    const a=h.c[k],b=h.c[(k+1)%6],ek=[a,b].sort().join('|');
    if(!E[ek]){E[ek]={k:ek,a,b};V[a].nb.push(b);V[b].nb.push(a);V[a].es.push(ek);V[b].es.push(ek)}
  }});
}
function showStart(){UNSUB&&UNSUB();UNSUB=null;ON=false;document.getElementById('tb').style.display='none';closeM();document.getElementById('start').style.display='block';document.getElementById('game').style.display='none'}
function mkHarbor(){
  Object.values(E).forEach(e=>{e.h=0});
  H.forEach(h=>{for(let k=0;k<6;k++)E[[h.c[k],h.c[(k+1)%6]].sort().join('|')].h++});
  const co=Object.values(E).filter(e=>e.h==1).map(e=>({a:e.a,b:e.b,ang:Math.atan2(V[e.a].y+V[e.b].y,V[e.a].x+V[e.b].x)})).sort((x,y)=>x.ang-y.ang);
  CO=co;const ts=sh(['any','any','any','any','wood','brick','sheep','wheat','ore']);
  return [0,3,7,10,13,17,20,23,27].map((i,j)=>({a:co[i].a,b:co[i].b,t:ts[j]}));
}

function newGame(n){
  document.getElementById('start').style.display='none';document.getElementById('game').style.display='block';
  order=[];for(let i=0;i<n;i++)order.push(i);for(let i=n-1;i>=0;i--)order.push(i);
  build();
  G={n,bb:(document.getElementById('xb')||{}).checked?{pos:0}:null,deck:sh([...Array(14).fill('knight'),...Array(5).fill('vp'),...Array(2).fill('road'),...Array(2).fill('plenty'),...Array(2).fill('mono')]),bought:[],played:false,free:0,p:Array.from({length:n},(_,i)=>i).map(i=>({res:{wood:0,brick:0,sheep:0,wheat:0,ore:0},dev:{knight:0,vp:0,road:0,plenty:0,mono:0},k:0})),B:{},R:{},rob:H.findIndex(h=>h.t=='desert'),
    cur:0,ph:'setup',si:0,sub:'settle',last:null,roll:0,mode:null,msg:'',win:-1};

let order=[];
const cnt=p=>RES.reduce((s,r)=>s+G.p[p].res[r],0);

const afford=(p,c)=>Object.keys(c).every(r=>G.p[p].res[r]>=c[r]);
const pay=(p,c)=>Object.keys(c).forEach(r=>G.p[p].res[r]-=c[r]);
function roadLen(p){
  let best=0;const used=new Set();
  function dfs(v,n){
    best=Math.max(best,n);
    V[v].es.forEach(e=>{
      if(used.has(e)||G.R[e]!==p)return;
      const o=E[e].a==v?E[e].b:E[e].a;
      used.add(e);
      if(G.B[o]&&G.B[o].p!=p)best=Math.max(best,n+1);else dfs(o,n+1);
      used.delete(e);
    });
  }
  Object.keys(V).forEach(v=>{if(V[v].es.some(e=>G.R[e]===p))dfs(v,0)});
  return best;
}
function updateLR(){
  const L=G.p.map((_,i)=>roadLen(i)),m=Math.max(...L),h=G.lr?G.lr.p:-1,top=L.map((l,i)=>l==m?i:-1).filter(i=>i>=0);
  const np=m>=5?(top.includes(h)?h:(top.length==1?top[0]:-1)):-1;

}
function canSettle(k,p){
  if(G.B[k])return false;

function canRoad(e,p){

function mkRiver(){

function modal(h,k){OPEN=k||'';document.getElementById('mb').innerHTML=h+'<div class="row"><button onclick="closeM()">閉じる</button></div>';document.getElementById('md').style.display='flex'}
function closeM(){OPEN='';DR=null;document.getElementById('md').style.display='none'}
function openRules(){modal(`<div style="line-height:1.7;font-size:14px"><b>目的</b><br>先に10点を取った人の勝ち。家は1点、街は2点です。<br><br><b>特別ポイント</b><br>最長交易路：つながった自分の道が5本以上で、いちばん長い人に2点。同じ長さなら先に持っていた人が守ります。相手の家で道が分断されることもあります。<br>最大騎士力：使った騎士が3枚以上で、いちばん多い人に2点。<br><br><b>発展カード</b><br>羊・麦・鉱を1枚ずつ払い、山札（全25枚）から1枚引きます。買ったターンは使えず、使えるのは1ターンに1枚、手番の中（サイコロの後）だけです。<br>騎士（14枚）：盗賊を動かして1枚奪う。<br>勝利点（5枚）：1点。使わずに持ちます。<br>街道建設（2枚）：道を2本無料で置く。<br>収穫（2枚）：好きな資源を2枚もらう。<br>独占（2枚）：好きな資源1種を全員から集める。<br><br><b>最初の配置</b><br>順番に家と道を1つずつ置き、最後の人から逆順でもう1セット置きます。2つ目の家に隣り合う土地から、資源を1枚ずつもらえます。<br><br><b>手番の流れ</b><br>1. サイコロを振る。出目と同じ数字の土地に隣り合う家は1枚、街は2枚の資源がもらえます。<br>2. 建設・取引をする。<br>3. 手番終了を押す。<br><br><b>7が出たとき</b><br>盗賊を動かす土地を選びます。その土地は盗賊がいる間は資源が出ません。隣に家のある相手がいれば、手札から1枚奪えます。<br><br><b>拡張：蛮族の襲来（商人と蛮族）</b><br>開始画面でチェックすると有効になります。サイコロを振るたびに、50%の確率で蛮族の船が1つ進み、7つ進むと襲来します。<br>蛮族の戦力は、盤上の街の数＋1です。前回の襲来以降に使われた騎士の合計が戦力以上なら撃退成功で、最も多く使った人が1点（同数なら無し）。足りなければ失敗で、騎士の数が最も少ない人（街を持つ人）の街が1つ家に戻ります。襲来のあと、騎士の数はリセットされます。<br><br><b>拡張（開始画面でチェック）</b><br>漁師：海ぞいに3つの漁場（魚マークと数字）が出ます。その数字が出ると、隣り合う家は魚1匹、街は2匹もらえます。「拡張」ボタンで、魚3匹＝好きな資源1枚、5匹＝道1本を無料で、7匹＝発展カード1枚と交換できます。<br>川：青い川が1本できます。川に面した辺に道、川の交点に家を建てると金貨1枚。金貨1枚は好きな資源1枚と交換できます。<br>商人：「拡張」から、自分の家か街が隣り合う土地に商人を置けます。商人を持つ人は1点で、その土地の資源を2:1で銀行と交換できます。<br>イベントカード：サイコロの代わりに39枚の山札を引きます（出目36枚と、豊作・疫病・盗賊の襲来）。<br><br><b>建設の費用</b><br>道：木1・土1<br>家：木1・土1・羊1・麦1<br>街：麦2・鉱3（自分の家を街にする）<br><br><b>置ける場所</b><br>家：となりの交点に他の家があると置けません。最初の配置以外は、自分の道につながる場所だけです。<br>道：自分の家か道につながる辺に置けます。<br><br><b>取引</b><br>銀行：同じ資源4枚を好きな資源1枚と交換できます。海ぞいの港マークにつながる家か街があると、3:1の港は3枚、2:1の港はその資源2枚で交換できます（海外貿易）。<br>プレイヤー同士：「通信」から、自分の手番に相手へ提案します。<br><br><b>この版で省いているもの</b><br>7のときの手札捨て。</div>`,'rules')}
const DN={knight:'騎士',vp:'勝利点',road:'街道建設',plenty:'収穫',mono:'独占'},DD={knight:'盗賊を動かして1枚奪う。3枚以上で最大騎士力',vp:'1点。使わずに持つ',road:'道を2本無料で置く',plenty:'好きな資源を2枚もらう',mono:'好きな資源1種を全員から集める'},DC={sheep:1,wheat:1,ore:1};
const nB=(p,t)=>G.p[p].dev[t]-G.bought.filter(x=>x==t).length;
function openDev(){
  const p=viewer();if(p<0)return modal('観戦中です。');
  const my=p==G.cur&&mine()&&G.ph=='main'&&G.win<0,d=G.p[p].dev;
  modal(`<div>${NAMES[p]}の発展カード（山札あと${G.deck.length}枚）</div>`+Object.keys(DN).map(t=>`<div class="pl"><span>${DN[t]}×${d[t]}${d[t]>nB(p,t)?'（今ターン購入）':''}<br><small>${DD[t]}</small></span>${t=='vp'?'':`<button onclick="useDev('${t}')" ${my&&nB(p,t)>0&&!G.played?'':'disabled'}>使う</button>`}</div>`).join('')+`<div class="row"><button onclick="buyDev()" ${my&&afford(p,DC)&&G.deck.length?'':'disabled'}>購入（羊・麦・鉱）</button></div>`,'dev');
}
function buyDev(){
  const p=viewer();if(p!=G.cur||!mine()||G.ph!='main'||!afford(p,DC)||!G.deck.length||G.win>=0)return;
  pay(p,DC);const t=G.deck.pop();G.p[p].dev[t]++;G.bought.push(t);G.msg=NAMES[p]+'が発展カードを買いました。';
  if(vp(p)>=10){G.win=p;G.msg=NAMES[p]+'の勝利！ 10点に到達しました。'}
  draw();
}
function useDev(t){
  const p=viewer();if(p!=G.cur||!mine()||G.ph!='main'||G.played||nB(p,t)<1)return;
  if(t=='plenty'||t=='mono'){
    const o=RES.map(r=>`<option value="${r}">${JP[r]}</option>`).join('');
    return modal(`<div>${t=='plenty'?'もらう資源を2つ選んでください':'集める資源を選んでください'}</div><div class="row"><select id="p1">${o}</select>${t=='plenty'?`<select id="p2">${o}</select>`:''}</div><div class="row"><button onclick="fin('${t}')">決定</button></div>`,'pick');
  }
  G.p[p].dev[t]--;G.played=true;closeM();
  if(t=='knight'){
    G.p[p].k++;G.p[p].kk=(G.p[p].kk||0)+1;G.ph='robber';G.msg=NAMES[p]+'が騎士を使いました。盗賊を動かす土地をタップしてください。';
    if(G.p[p].k>=3&&(!G.la||(G.la.p!=p&&G.p[p].k>G.p[G.la.p].k))){G.la={p};G.msg+=' 最大騎士力を獲得！+2点'}
    if(vp(p)>=10){G.win=p;G.msg=NAMES[p]+'の勝利！ 10点に到達しました。'}
  }else{G.free=2;G.mode='road';G.msg='街道建設：道を2本置いてください。'}
  draw();
}
function fin(t){
  const p=G.cur,a=document.getElementById('p1').value,r=G.p[p].res;
  if(t=='plenty'){const b=document.getElementById('p2').value;r[a]++;r[b]++;G.msg=NAMES[p]+'が収穫を使い、'+JP[a]+'と'+JP[b]+'をもらいました。'}
  else{let n=0;G.p.forEach((q,i)=>{if(i!=p){n+=q.res[a];q.res[a]=0}});r[a]+=n;G.msg=NAMES[p]+'が独占を使い、'+JP[a]+'を'+n+'枚集めました。'}
  G.p[p].dev[t]--;G.played=true;closeM();draw();
}
function openBag(){const v=viewer();if(v<0)return modal('観戦中です。');modal(`<div>${NAMES[v]}の持ち物</div><div class="cards">`+RES.map(r=>cardH(r,G.p[v].res[r])).join('')+'</div><div>発展カード：'+Object.keys(DN).map(t=>DN[t]+G.p[v].dev[t]).join('　')+'</div>','bag')}
function openTrade(){
  const v=viewer(),t=G.tr;if(v<0)return modal('観戦中です。');
  if(t){
    if(t.to==v)return modal(`<div><b>${NAMES[t.from]}</b>からの提案<br>あなたが渡す：${rs(t.want)}<br>受け取る：${rs(t.give)}</div><div class="row"><button onclick="ans(1)">承諾</button><button onclick="ans(0)">断る</button></div>`,'tr');
    if(t.from==v)return modal(`<div>${NAMES[t.to]}の返事待ち<br>渡す：${rs(t.give)}　欲しい：${rs(t.want)}</div><div class="row"><button onclick="ans(2)">取り消す</button></div>`,'tr');
    return modal(`<div>${NAMES[t.from]}と${NAMES[t.to]}が交渉中です。</div>`,'tr');
  }
  if(!(G.ph=='main'&&G.cur==v&&mine()))return modal('取引は自分の手番（サイコロの後）にできます。');
  if(!DR)DR={to:[...Array(G.n).keys()].find(i=>i!=v),give:{},want:{}};
  renderDraft(v);
}
function stp(w,r){return `<span class="st">${JP[r]}<button onclick="stp2('${w}','${r}',-1)">−</button>${DR[w][r]||0}<button onclick="stp2('${w}','${r}',1)">＋</button></span>`}
function stp2(w,r,d){DR[w][r]=Math.max(0,Math.min(w=='give'?G.p[viewer()].res[r]:9,(DR[w][r]||0)+d));renderDraft(viewer())}
function renderDraft(v){
  const o=[...Array(G.n).keys()].filter(i=>i!=v).map(i=>`<option value="${i}" ${DR.to==i?'selected':''}>${NAMES[i]}</option>`).join('');
  modal(`<div>取引の相手　<select onchange="DR.to=+this.value">${o}</select></div><div class="row">渡す：${RES.map(r=>stp('give',r)).join('')}</div><div class="row">欲しい：${RES.map(r=>stp('want',r)).join('')}</div><div class="row"><button onclick="sendTr()">提案する</button></div>`,'draft');
}
function sendTr(){
  const v=viewer(),sum=o=>RES.reduce((s,r)=>s+(o[r]||0),0);
  if(!sum(DR.give)||!sum(DR.want))return;
  G.tr={from:v,to:DR.to,give:{...DR.give},want:{...DR.want}};G.msg=NAMES[v]+'が'+NAMES[DR.to]+'に取引を提案しました。';DR=null;draw();if(ON)openTrade();
}
function ans(ok){
  const t=G.tr;if(!t)return;
  const a=G.p[t.from].res,b=G.p[t.to].res,x=r=>t.give[r]||0,y=r=>t.want[r]||0;
  if(ok===1){
    if(RES.every(r=>a[r]>=x(r)&&b[r]>=y(r))){RES.forEach(r=>{a[r]+=y(r)-x(r);b[r]+=x(r)-y(r)});G.msg=NAMES[t.to]+'が承諾。取引が成立しました。'}
    else G.msg='資源が足りず取引は成立しませんでした。';
  }else G.msg=ok===2?'提案を取り消しました。':NAMES[t.to]+'が取引を断りました。';
  G.tr=null;closeM();draw();
}
let ON=false,UID=null,CODE='',INV='',SEATS=[],remote=false,ROOM=null,ME=null,DS=null,UNSUB=null,STARTED=false;
const mine=()=>!ON||(!SEATS.includes('')&&SEATS[G.cur]===UID);
function setOrder(n){order=[];for(let i=0;i<n;i++)order.push(i);for(let i=n-1;i>=0;i--)order.push(i)}
const val=id=>document.getElementById(id).value;
const err=m=>{document.getElementById('serr').textContent=m};
function cpInv(){const i=document.getElementById('invc');i.select();navigator.clipboard?navigator.clipboard.writeText(INV):document.execCommand('copy')}
function send(o){try{DS&&DS.write(JSON.stringify(o))}catch(e){}}
function push(){send({t:'st',seats:SEATS,s:JSON.stringify(G)})}
function redraw(){remote=true;draw();remote=false}
function hello(){if(STARTED||!ME)return;send({t:'hello',u:UID});setTimeout(hello,2000)}
function onMsg(raw){
  let m;try{m=JSON.parse(raw)}catch(e){return}
  if(m.t=='hello'){
    if(!ON||SEATS[0]!==UID)return;
    if(!SEATS.includes(m.u)){const i=SEATS.indexOf('');if(i>=0)SEATS[i]=m.u}
    push();redraw();
  }else if(m.t=='st'){
    SEATS=m.seats;G=JSON.parse(m.s);STARTED=true;ON=true;setOrder(G.n);build(G.bt,G.bn);
    document.getElementById('start').style.display='none';document.getElementById('game').style.display='block';redraw();
  }
}
async function net(tok,name){
  if(typeof skyway_room=='undefined')throw new Error('SkyWayライブラリを読み込めませんでした');
  const {SkyWayContext,SkyWayRoom,SkyWayStreamFactory}=skyway_room;
  const ctx=await SkyWayContext.Create(tok);
  ROOM=await SkyWayRoom.FindOrCreate(ctx,{type:'p2p',name});
  ME=await ROOM.join();UID=ME.id;
  DS=await SkyWayStreamFactory.createDataStream();await ME.publish(DS);
  const sub=async p=>{if(p.publisher.id===ME.id||p.contentType!=='data')return;const {stream}=await ME.subscribe(p.id);stream.onData.add(onMsg)};
  ROOM.publications.forEach(sub);ROOM.onStreamPublished.add(e=>sub(e.publication));
  UNSUB=()=>{const m=ME;ROOM=ME=DS=null;STARTED=false;m&&m.leave().catch(()=>{})};
}
async function mk(){
  const id=val('aid').trim(),sec=val('sec').trim(),n=+val('on');
  if(!id||!sec)return err('アプリケーションIDとシークレットキーを入れてください');
  try{
    if(typeof skyway_room=='undefined')throw new Error('SkyWayライブラリを読み込めませんでした');
    const {nowInSec,SkyWayAuthToken,uuidV4}=skyway_room,name=Math.random().toString(36).slice(2,8);
    const tok=new SkyWayAuthToken({jti:uuidV4(),iat:nowInSec(),exp:nowInSec()+86400,version:3,scope:{appId:id,rooms:[{id:'*',name:'*',methods:['create','close','updateMetadata'],member:{id:'*',name:'*',methods:['publish','subscribe','updateMetadata']}}]}}).encode(sec);
    document.getElementById('sec').value='';
    await net(tok,name);
    newGame(n);SEATS=[UID,...Array(n-1).fill('')];ON=true;CODE=name;INV=name+'|'+tok;
    document.getElementById('invc').value=INV;redraw();
  }catch(e){err('失敗しました：'+(e.message||e))}
}
async function jn(){
  const v=val('rc').trim(),i=v.indexOf('|');
  if(i<1)return err('招待コードが正しくありません');
  try{await net(v.slice(i+1),v.slice(0,i));CODE=v.slice(0,i);ON=true;SEATS=[];err('接続中…ホストの画面に反映されるまで少しお待ちください');hello()}
  catch(e){err('接続できませんでした：'+(e.message||e))}
}
showStart();
</script></body></html>
